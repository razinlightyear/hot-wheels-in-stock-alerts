name: Hot Wheels Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch: # Allows manual triggering from the UI

jobs:
  check-stock:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the state.json update
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Monitor
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: npx tsx index.ts

      - name: Commit State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          # Only commit if the state actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update inventory state" && git push)